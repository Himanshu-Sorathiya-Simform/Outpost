<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Outpost — field dispatch log</title>
    <meta name="description" content="Dispatches, station telemetry and field handbook from the Outpost relay network." />
    <meta name="theme-color" content="#ede8da" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The web app manifest (public/manifest.webmanifest) makes the site installable; the apple-touch-icon is what iOS Safari puts on the home screen. The service worker is registered from src/pwa/boot.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Must never throw.
      try {
        var t = localStorage.getItem('outpost.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Outpost needs JavaScript. The dispatch log does not render without it.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
